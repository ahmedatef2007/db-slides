<section id="statement" data-transition="fade" style="background:#E07A3F;color:#3F4A5C;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:center;gap:40px"><h2 style="font-family:'Space Grotesk', Arial, sans-serif;font-size:84px;font-weight:600;line-height:1.1;color:#14213D;width:1500px">A DBMS separates <b>what</b> the data means from <b>how</b> it is stored.</h2><p style="font-size:36px;line-height:1.4;color:#14213D;width:1400px">Everything in this course builds on that idea: we design the meaning (ERD, tables, normalization) and let the DBMS handle storage.</p></section>
